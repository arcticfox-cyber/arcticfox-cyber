
name: Update Repository Dashboard

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate repository dashboard and chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import html
          import urllib.request
          from collections import Counter

          username = "arcticfox-cyber"
          token = os.environ["GITHUB_TOKEN"]

          repos = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner&sort=updated"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  batch = json.loads(response.read().decode())

              if not batch:
                  break

              repos.extend(batch)
              page += 1

          # Exclude the profile README repository itself.
          repos = [
              r for r in repos
              if r["name"].lower() != username.lower()
          ]

          repos.sort(
              key=lambda r: r.get("stargazers_count", 0),
              reverse=True
          )

          # Build repository dashboard.
          rows = [
              "| Repository | Description | Language | Stars | Forks |",
              "|:---|:---|:---:|---:|---:|"
          ]

          for repo in repos:
              name = repo["name"]
              link = repo["html_url"]
              description = html.escape(
                  (repo.get("description") or "No description provided.")
                  .replace("|", "&#124;")
              )
              language = html.escape(repo.get("language") or "Other")
              stars = repo.get("stargazers_count", 0)
              forks = repo.get("forks_count", 0)

              rows.append(
                  f"| [{name}]({link}) | {description} | "
                  f"{language} | ⭐ {stars} | 🍴 {forks} |"
              )

          if not repos:
              rows.append("| No public repositories found | — | — | 0 | 0 |")

          dashboard = "\n".join(rows)

          readme_path = "README.md"
          with open(readme_path, "r", encoding="utf-8") as file:
              readme = file.read()

          start = "<!-- REPOSITORY-DASHBOARD:START -->"
          end = "<!-- REPOSITORY-DASHBOARD:END -->"

          if start not in readme or end not in readme:
              raise RuntimeError("Repository dashboard markers missing in README.md")

          before, remaining = readme.split(start, 1)
          _, after = remaining.split(end, 1)

          updated_readme = before + start + "\n\n" + dashboard + "\n\n" + end + after

          with open(readme_path, "w", encoding="utf-8") as file:
              file.write(updated_readme)

          # Count primary programming languages across public repositories.
          counts = Counter(
              repo.get("language") or "Other"
              for repo in repos
          )

          languages = counts.most_common(12)

          # Generate a self-hosted SVG chart.
          width = 1000
          row_height = 48
          height = max(170, 110 + len(languages) * row_height)

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" viewBox="0 0 {width} {height}">',
              '<rect width="100%" height="100%" rx="16" fill="#0d1117"/>',
              '<text x="35" y="42" fill="#ff4545" font-size="25" '
              'font-family="Arial" font-weight="bold">REPOSITORY LANGUAGES</text>',
              f'<text x="35" y="72" fill="#c9d1d9" font-size="14" '
              f'font-family="Arial">Public repositories: {len(repos)}</text>'
          ]

          max_count = max((count for _, count in languages), default=1)

          for index, (language, count) in enumerate(languages):
              y = 105 + index * row_height
              bar_width = int(500 * count / max_count)
              label = html.escape(language)

              svg.append(
                  f'<text x="35" y="{y + 18}" fill="#e6edf3" '
                  f'font-size="15" font-family="Arial">{label}</text>'
              )
              svg.append(
                  f'<rect x="230" y="{y}" width="500" height="17" '
                  f'rx="8" fill="#30363d"/>'
              )
              svg.append(
                  f'<rect x="230" y="{y}" width="{bar_width}" height="17" '
                  f'rx="8" fill="#ff3030"/>'
              )
              svg.append(
                  f'<text x="750" y="{y + 14}" fill="#e6edf3" '
                  f'font-size="14" font-family="Arial">{count} repos</text>'
              )

          if not languages:
              svg.append(
                  '<text x="35" y="125" fill="#c9d1d9" '
                  'font-size="16" font-family="Arial">No language data available yet.</text>'
              )

          svg.append("</svg>")

          with open("repository-language-chart.svg", "w", encoding="utf-8") as file:
              file.write("\n".join(svg))

          print(f"Updated dashboard with {len(repos)} public repositories.")
          print("Generated repository-language-chart.svg")
          PY

      - name: Commit dashboard updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md repository-language-chart.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update automatic repository dashboard"
            git push
          else
            echo "No dashboard changes."
          fi
