<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="112" viewBox="0 0 900 112" role="img" aria-labelledby="title">
  <title id="title">Animated white Arctic fox running</title>
  <defs>
    <linearGradient id="winterFur" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#c9dced"/>
    </linearGradient>
    <linearGradient id="tailFur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#e8f2fb"/>
      <stop offset="1" stop-color="#aebfd0"/>
    </linearGradient>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="translate" from="-170 0" to="920 0" dur="8s" repeatCount="indefinite"/>
    <g transform="translate(0 7)" stroke="#647b91" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <!-- Large, fluffy white tail -->
      <path d="M43 53 C18 23 5 18 0 25 C7 40 7 66 31 78 C47 86 63 70 66 57Z" fill="url(#tailFur)">
        <animateTransform attributeName="transform" type="rotate" values="0 48 58;9 48 58;0 48 58;-7 48 58;0 48 58" dur=".52s" repeatCount="indefinite"/>
      </path>
      <path d="M3 26 Q17 25 29 42 Q15 38 8 52 Q8 36 3 26Z" fill="#d8e7f4" stroke="none"/>
      <!-- Compact winter-coated body -->
      <ellipse cx="82" cy="55" rx="43" ry="23" fill="url(#winterFur)"/>
      <path d="M49 60 Q70 82 101 62 Q89 83 65 76Z" fill="#dceaf6" stroke="none"/>
      <!-- Neck, head and short rounded ears -->
      <path d="M105 47 Q119 27 137 35 L147 51 Q133 65 111 62Z" fill="url(#winterFur)"/>
      <path d="M119 37 L119 17 Q131 23 135 38Z" fill="#f5faff"/>
      <path d="M138 39 L149 24 Q154 37 150 49Z" fill="#f5faff"/>
      <path d="M123 33 L124 23 L130 35Z M142 39 L148 30 L148 43Z" fill="#aebfd0" stroke="none"/>
      <path d="M137 51 Q153 45 164 52 Q155 62 139 59Z" fill="#ffffff"/>
      <circle cx="139" cy="43" r="2.7" fill="#263746" stroke="none"/>
      <path d="M161 50 Q165 48 167 52 Q165 56 161 54Z" fill="#263746" stroke="none"/>
      <!-- Far legs -->
      <g fill="#dce8f2">
        <path d="M59 68 L53 89 L44 95">
          <animateTransform attributeName="transform" type="rotate" values="27 59 68;-27 59 68;27 59 68" dur=".34s" repeatCount="indefinite"/>
        </path>
        <path d="M105 68 L111 89 L120 94">
          <animateTransform attributeName="transform" type="rotate" values="-27 105 68;27 105 68;-27 105 68" dur=".34s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- Near legs -->
      <g fill="#f7fbff">
        <path d="M70 70 L65 92 L56 98">
          <animateTransform attributeName="transform" type="rotate" values="-31 70 70;31 70 70;-31 70 70" dur=".34s" repeatCount="indefinite"/>
        </path>
        <path d="M96 70 L102 92 L111 98">
          <animateTransform attributeName="transform" type="rotate" values="31 96 70;-31 96 70;31 96 70" dur=".34s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- Dark paw tips, characteristic winter contrast -->
      <path d="M44 95 L37 98 M120 94 L127 97 M56 98 L49 101 M111 98 L118 101" fill="none" stroke="#536779" stroke-width="3"/>
    </g>
  </g>
</svg>